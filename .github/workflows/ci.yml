name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['24']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup JS
        uses: sxzz/workflows/setup-js@main
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install DSH and Playwright
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh-cli" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.3-alpha.3
          pnpm exec playwright install --with-deps chromium
          node --input-type=module -e "import fs from 'node:fs'; import path from 'node:path'; const cli = path.join(process.env.RUNNER_TEMP, 'dsh-cli/node_modules/@deepseek-ai/dsh/lib/bin.js'); fs.accessSync(cli); fs.appendFileSync(process.env.GITHUB_ENV, 'DSH_E2E_CLI=' + cli + '\n');"

      - name: Lint and typecheck
        run: pnpm run lint && pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Test (E2E)
        run: pnpm run test:e2e
        env:
          DSH_E2E_REQUIRED: '1'
